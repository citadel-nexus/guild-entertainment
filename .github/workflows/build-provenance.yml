# ─── CGRF Header ───────────────────────────────────────────────
# File: .github/workflows/build-provenance.yml
# Stage: 11_COMMIT
# SRS: SRS-CN-ENTERTAINMENT-GOVERNANCE-001, SRS-CN-ENTERTAINMENT-BUILD-001
# CAPS: pending
# CK: pending
# Dispatch: DISP-GOVERNANCE-entertainment
# Seat: BITS-CODEGEN
# Owner: Citadel Nexus Inc.
# Created: 2026-10-20
# Depends: package.json, .bits/check_governance.py
# EnumType: Workflow
# EnumEdges: DEPENDS_ON package.json; VALIDATES .bits/check_governance.py
# DAG Node: none
# Intent: Bind the compiled distribution digest to a trusted main-branch GitHub build.
# ───────────────────────────────────────────────────────────────

name: Build provenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r .bits/requirements-checks.txt
      - run: python .bits/check_governance.py
      - run: python .bits/check_governance.py --mutations
      - run: python .bits/check_build.py
      - run: mypy --strict .bits/check_governance.py .bits/check_build.py

  build-artifact:
    needs: governance-checks
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@citadel-guilds'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: rm -rf dist && npm run build
      - name: Package build distribution
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.js
          mkdir -p artifacts
          tar -czf artifacts/guild-entertainment-dist.tar.gz dist package.json package-lock.json README.md LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entertainment-dist
          path: artifacts/guild-entertainment-dist.tar.gz
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'citadel-nexus/guild-entertainment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: entertainment-dist
          path: artifacts
      - name: Sign SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: artifacts/guild-entertainment-dist.tar.gz
      - name: Preserve verification bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          cp -- "$BUNDLE_PATH" provenance/provenance.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entertainment-provenance
          path: provenance/provenance.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Verify artifact and reject tampering and wrong signer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          artifact=artifacts/guild-entertainment-dist.tar.gz
          repo=citadel-nexus/guild-entertainment
          signer="$repo/.github/workflows/build-provenance.yml"
          verify() {
            gh attestation verify "$1" \
              --bundle provenance/provenance.jsonl \
              --repo "$repo" --signer-workflow "$2" \
              --source-ref refs/heads/main --source-digest "$EXPECTED_COMMIT" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners
          }
          verify "$artifact" "$signer"
          tampered=$(mktemp)
          trap 'rm -f "$tampered"' EXIT
          cp -- "$artifact" "$tampered"
          printf '\001' >> "$tampered"
          if verify "$tampered" "$signer"; then
            echo 'FAIL: tampered artifact accepted' >&2
            exit 1
          fi
          if verify "$artifact" "$repo/.github/workflows/ci.yml"; then
            echo 'FAIL: wrong signer accepted' >&2
            exit 1
          fi
          # Recheck the positive control so transient verification failure is not success.
          verify "$artifact" "$signer"
